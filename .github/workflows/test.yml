name: Shorky Consumer Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Shorky's auto-healer needs to push a new branch and open a pull request
# using GITHUB_TOKEN, which requires both of these permissions explicitly
# granted (the default token is otherwise read-only for contents/PRs).
permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chrome

      # 1. Run the Playwright suite with JSON reporting enabled so Shorky can
      #    parse failures + locate trace.zip attachments afterward.
      - name: Run Playwright Tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: "test-results/report.json"
        run: |
          mkdir -p test-results
          npx playwright test --project="Google Chrome" --reporter=json,list

      # 2. On failure, invoke the published Shorky marketplace action to
      #    analyze the failed trace(s) with an LLM and open an auto-healing
      #    pull request with the proposed fix.
      - name: Run Shorky Auto-Healer
        if: failure()
        uses: whoff77/shorky@v1.2.0
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          report-path: "test-results/report.json"

      # 3. Always upload the HTML report + traces as a build artifact for
      #    manual inspection, regardless of pass/fail.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # 4. Always upload the raw test-results/ directory (trace.zip files,
      #    failure screenshots, and visual regression diff images) so
      #    failures can be inspected directly without re-running the suite.
      - name: Upload test artifacts (traces, screenshots, visual diffs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
