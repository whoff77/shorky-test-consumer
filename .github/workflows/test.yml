name: Shorky Consumer Test Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    # Guard against recursive CI loops / automated PR cascades:
    # skip runs triggered by the github-actions[bot] (e.g. Shorky's own
    # commits/merges) and skip any branch created by Shorky's auto-heal flow.
    if: >-
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.ref_name, 'shorky/')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      SHORKY_CLOUD_URL: ${{ vars.SHORKY_CLOUD_URL }}
      SHORKY_CLOUD_API_KEY: ${{ secrets.SHORKY_CLOUD_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chrome

      # 1. Run the Playwright suite (relying on playwright.config.ts for reporters,
      # ensuring cloudReporter and JSON output are both active)
      - name: Run Playwright Tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: "test-results/report.json"
        run: |
          mkdir -p test-results
          npx playwright test --project="Google Chrome"

      # 2. On failure, invoke the published Shorky marketplace action
      - name: Run Shorky Auto-Healer
        if: failure()
        uses: whoff77/shorky@v1.3.3
        with:
          shorky-cloud-url: ${{ env.SHORKY_CLOUD_URL }}
          shorky-cloud-api-key: ${{ env.SHORKY_CLOUD_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          report-path: "test-results/report.json"

      # 3. Always upload the HTML report + traces as a build artifact
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # 4. Always upload the raw test-results/ directory
      - name: Upload test artifacts (traces, screenshots, visual diffs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14